name: Kadr
options:
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: uk
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  Kadr:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Media
        buildPhase: resources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Кадр
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        NSMicrophoneUsageDescription: Запис голосових повідомлень перед надсиланням.
        NSCameraUsageDescription: Сканування QR-кодів профілів.
        CFBundleURLTypes:
          - CFBundleURLSchemes: [kadr]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.kadr.prototype
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.5.1"
        CURRENT_PROJECT_VERSION: "1"
    scheme:
      testTargets:
        - KadrUITests
  KadrUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: Kadr
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.kadr.prototype.ui-tests
        TARGETED_DEVICE_FAMILY: "1"
