name: iOS simulator build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        run: |
          xcodebuild -version
          brew install xcodegen
          xcodegen generate --spec ios/project.yml
      - name: Build Kadr for the iOS Simulator
        run: |
          set -euo pipefail
          xcodebuild -project ios/Kadr.xcodeproj -scheme Kadr \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios/build CODE_SIGNING_ALLOWED=NO build
      - name: Package simulator app
        run: |
          set -euo pipefail
          app=ios/build/Build/Products/Debug-iphonesimulator/Kadr.app
          test -s "$app/bunny.mp4"
          test -s "$app/sintel.mp4"
          ditto -c -k --keepParent "$app" Kadr-iOS-Simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Kadr-iOS-Simulator
          path: Kadr-iOS-Simulator.zip
          if-no-files-found: error
