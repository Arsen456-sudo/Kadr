name: iOS simulator build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[ipa only]')
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        run: |
          xcodebuild -version
          brew install xcodegen
          xcodegen generate --spec ios/project.yml
      - name: Build Kadr for the iOS Simulator
        run: |
          set -euo pipefail
          xcodebuild -project ios/Kadr.xcodeproj -scheme Kadr \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios/build CODE_SIGNING_ALLOWED=NO build
      - name: Package simulator app
        run: |
          set -euo pipefail
          app=ios/build/Build/Products/Debug-iphonesimulator/Kadr.app
          test -s "$app/bunny.mp4"
          test -s "$app/sintel.mp4"
          ditto -c -k --keepParent "$app" Kadr-iOS-Simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Kadr-iOS-Simulator
          path: Kadr-iOS-Simulator.zip
          if-no-files-found: error
      - name: Test native navigation on an iPhone simulator
        run: |
          set -euo pipefail
          simulator="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          runtimes = json.load(sys.stdin)["devices"]
          phones = [device for runtime, devices in reversed(list(runtimes.items()))
                    if ".iOS-" in runtime for device in devices
                    if device["name"].startswith("iPhone") and device["isAvailable"]]
          sys.exit("No iPhone simulator runtime is available") if not phones else print(phones[0]["udid"])
          ')"
          xcodebuild -project ios/Kadr.xcodeproj -scheme Kadr \
            -configuration Debug -destination "platform=iOS Simulator,id=$simulator" \
            -derivedDataPath ios/build CODE_SIGNING_ALLOWED=NO \
            -parallel-testing-enabled NO -resultBundlePath ios/build/KadrUITests.xcresult test
      - name: Export UI screenshots from the simulator test
        run: |
          mkdir -p ios/build/screenshots
          xcrun xcresulttool export attachments --path ios/build/KadrUITests.xcresult \
            --output-path ios/build/screenshots
      - uses: actions/upload-artifact@v4
        with:
          name: Kadr-simulator-screenshots
          path: |
            ios/build/screenshots/*.png
            ios/build/screenshots/manifest.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Kadr-navigation-test-result
          path: ios/build/KadrUITests.xcresult
          if-no-files-found: ignore
